name: Build Custom RAGFlow

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия образа (например, v0.25.6)'
        required: true
        default: 'v0.25.6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            iicupro/ragflow-big-limit-topn-custom:latest
            iicupro/ragflow-big-limit-topn-custom:${{ github.event.inputs.version || 'v0.25.6' }}
          platforms: linux/amd64
